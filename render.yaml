services:
  - type: web
    name: eg-attendance-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: >-
      npm install &&
      npm run build --workspace=domain &&
      npm run build --workspace=backend &&
      npm run prisma:migrate --workspace=backend
    startCommand: node backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.9.0
      # Must be Neon's DIRECT connection string (no `-pooler` in the hostname) -- the
      # pooler cannot hold the session advisory lock that `migrate deploy` requires.
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
